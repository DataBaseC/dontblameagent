name: ci

# 最小质量门禁：能编过 + 全部 Verify 套件通过。
# Windows 与 Linux 双跑：AgentFramework.Desktop 虽是 net10.0-windows（WinForms），
# 但已声明 EnableWindowsTargeting，整个 sln 在 Linux 上也能编译，故无需为 CI 拆条件编译。
# VerifySandbox 是平台相关套件（Windows Job Object / Linux bwrap，且「超时终结进程树」
# 在无 bwrap 的 Linux 容器里语义不同），仅在 Windows 跑；Linux 跳过并在下方注明，不静默掩盖。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build solution (Debug)
        run: >
          dotnet build AgentFramework.sln -c Debug -m:1 --nologo -v quiet
          /p:UseSharedCompilation=false /nodeReuse:false

      - name: Run verify suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $suites = @(
            'Verify', 'VerifyData', 'VerifyAgent', 'VerifyTools', 'VerifySandbox',
            'VerifyComputerUse', 'VerifyPlugins', 'VerifyLlm', 'VerifyHost', 'VerifyLauncher',
            'VerifyWeb', 'VerifySummary', 'VerifyRephrase', 'VerifyContext', 'VerifyMemory',
            'VerifyToolsets', 'VerifyBaseKit', 'VerifyCheckpoint', 'VerifyEvolution', 'VerifySecrets'
          )
          # VerifySandbox 依赖平台特性（Job Object / bwrap / 进程树终结），仅在 Windows 跑。
          if (-not $IsWindows) {
            Write-Host "非 Windows：跳过 VerifySandbox（平台相关）" -ForegroundColor Yellow
            $suites = $suites | Where-Object { $_ -ne 'VerifySandbox' }
          }
          $failed = @()
          foreach ($name in $suites) {
            $proj = "tests/AgentFramework.$name/AgentFramework.$name.csproj"
            if (-not (Test-Path $proj)) {
              Write-Host "跳过 $name（找不到 $proj）" -ForegroundColor Yellow
              continue
            }
            Write-Host ""
            Write-Host "============== $name =============="
            dotnet run --project $proj -c Debug --no-build --nologo
            if ($LASTEXITCODE -ne 0) {
              Write-Host ">>> $name 失败（退出码 $LASTEXITCODE）" -ForegroundColor Red
              $failed += $name
            }
          }
          Write-Host ""
          if ($failed.Count -gt 0) {
            Write-Host "失败套件：$($failed -join ', ')" -ForegroundColor Red
            exit 1
          }
          Write-Host "全部套件通过。" -ForegroundColor Green
